<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>1History — TikTok authorization</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b1020;color:#e8ecf5;margin:0;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  main{max-width:560px}
  h1{font-size:1.4rem;margin:0 0 .6rem}
  p{line-height:1.5;margin:.4rem 0}
  code{background:#1a2238;padding:.15em .4em;border-radius:4px;word-break:break-all}
  .ok{color:#7fd8a6}.err{color:#ff8a8a}
</style>
</head>
<body>
<main>
  <h1>1History — TikTok authorization</h1>
  <p id="msg">Checking…</p>
  <p>Copy this page's full address from the browser's address bar and paste it into the
     <code>authorize_tiktok.py</code> prompt. Nothing else happens on this page; you can close it afterwards.</p>
</main>
<script>
  (function(){
    var q = new URLSearchParams(location.search), m = document.getElementById('msg');
    if (q.get('error')) { m.className = 'err'; m.textContent = 'TikTok returned an error: ' + q.get('error') + ' ' + (q.get('error_description') || ''); }
    else if (q.get('code')) { m.className = 'ok'; m.textContent = 'Authorization received.'; }
    else { m.textContent = 'No authorization code in this address.'; }
  })();
</script>
</body>
</html>
